<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVision</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CloudVision</h1>
        <p class="subtitle">Smart Image Optimization</p>

        <div class="upload-box">

            <h2>Optimize Your Image</h2>
            <p>Select an image to reduce its size without losing quality.</p>

            <input type="file" id="imageInput" accept="image/*">

            <label for="imageInput" class="upload-button">
                Choose Image
            </label>

            <div id="fileInfo"></div>

            <img id="preview" alt="Image Preview">

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
